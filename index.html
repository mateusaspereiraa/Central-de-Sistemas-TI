<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central de Sistemas T.I. | Mateus Pereira</title>
<style>
:root{--bg:#f2f5f9;--c:#fff;--t:#14202e;--m:#5a6a7c;--l:#d5dde8;--a:#0f6fff;--ok:#128a4a;--er:#cc3b2b;--wa:#b86e00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0d141d;--c:#16202c;--t:#e7eef7;--m:#93a3b6;--l:#263446;--a:#5b9bff;--ok:#4fd18b;--er:#ff7a6a;--wa:#f0b04f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}[hidden]{display:none!important}
button,input,select{font:inherit}input,select{width:100%;padding:9px 10px;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t)}
button{cursor:pointer;border:1px solid var(--a);background:transparent;color:var(--a);border-radius:8px;padding:8px 13px;font-weight:600}button.p{background:var(--a);color:#fff}button.d{border-color:var(--er);color:var(--er)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--a);outline-offset:1px}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.box{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:24px;width:min(380px,100%)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}.brand svg{width:38px;height:38px}.sub{color:var(--m);font-size:.88rem;margin:6px 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:var(--a);color:#fff}.err{color:var(--er);min-height:1.4em;font-size:.85rem;margin:6px 0}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--c);border-bottom:1px solid var(--l)}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px}nav button.on{background:var(--a);color:#fff}
main{max-width:1050px;margin:0 auto;padding:4px 16px 50px}.k{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.st{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px}.st small{color:var(--m)}.st b{display:block;font-size:1.5rem}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}label{font-size:.78rem;color:var(--m);display:block;margin-bottom:3px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}th{color:var(--m);font-size:.75rem;text-transform:uppercase}
.tag{padding:2px 9px;border-radius:99px;font-size:.75rem;border:1px solid var(--l)}.ok{color:var(--ok)}.er{color:var(--er)}.wa{color:var(--wa)}
.bar{display:grid;grid-template-columns:130px 1fr 36px;gap:8px;align-items:center;margin:6px 0;font-size:.88rem}.bar i{display:block;height:12px;border-radius:6px;background:var(--a)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.row input{max-width:260px}h2{margin:0 0 10px;font-size:1.1rem}
</style></head><body>
<div id="auth"><div class="box"><div class="brand"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#0f6fff"/><path d="M9 28V12l11 12 11-12v16" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"/></svg>Central de Sistemas T.I.</div>
<p class="sub">Mateus Pereira · Manutenção, redes, estoque e finanças em um só lugar.</p>
<div class="tabs"><button class="on" data-m="in">Entrar</button><button data-m="up">Criar conta</button></div>
<label for="em">E-mail</label><input id="em" type="email" autocomplete="username"><label for="pw" style="margin-top:8px">Senha (mín. 6)</label><input id="pw" type="password" autocomplete="current-password">
<div class="err" id="er"></div><button class="p" id="go" style="width:100%">Entrar</button></div></div>
<div id="app" hidden><header><div class="brand">Central T.I.</div><div><span id="who" style="color:var(--m);font-size:.85rem"></span> <button id="out">Sair</button></div></header><nav id="nav"></nav><main id="main"></main></div>
<script>
var $=function(i){return document.getElementById(i)},U='ct_users',S='ct_session',cur=null,tab='painel',editI=null,q='';
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function R(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function sm(a,k){return a.reduce(function(x,r){return x+(+r[k]||0)},0)}
var today=new Date().toISOString().slice(0,10);
var M={
 chamados:{t:'Manutenção',i:'🛠️',f:[['cliente','Cliente'],['equip','Equipamento'],['problema','Problema'],['status','Status','s',['Aberto','Em andamento','Concluído']],['valor','Valor (R$)','n'],['data','Data','d']],
  sum:function(r){return[['Abertos',r.filter(function(x){return x.status!=='Concluído'}).length],['Concluídos',r.filter(function(x){return x.status==='Concluído'}).length],['Faturado',R(sm(r.filter(function(x){return x.status==='Concluído'}),'valor'))]]},
  seed:[{cliente:'Escritório Silva',equip:'Notebook Dell',problema:'Troca de SSD e formatação',status:'Concluído',valor:280,data:today},{cliente:'Loja Central',equip:'PC Desktop',problema:'Limpeza e troca de pasta térmica',status:'Em andamento',valor:120,data:today},{cliente:'Maria Souza',equip:'Impressora',problema:'Não imprime em rede',status:'Aberto',valor:0,data:today}]},
 redes:{t:'Redes',i:'🌐',f:[['nome','Equipamento'],['tipo','Tipo','s',['Roteador','Switch','Access Point','Servidor','Câmera','Outro']],['ip','Endereço IP'],['local','Local'],['status','Status','s',['Online','Offline']]],
  sum:function(r){return[['Equipamentos',r.length],['Online',r.filter(function(x){return x.status==='Online'}).length],['Offline',r.filter(function(x){return x.status==='Offline'}).length]]},
  seed:[{nome:'Roteador principal',tipo:'Roteador',ip:'192.168.0.1',local:'Recepção',status:'Online'},{nome:'Switch 24 portas',tipo:'Switch',ip:'192.168.0.2',local:'Rack',status:'Online'},{nome:'AP Sala 2',tipo:'Access Point',ip:'192.168.0.20',local:'Sala 2',status:'Offline'}]},
 estoque:{t:'Estoque',i:'📦',f:[['produto','Produto'],['qtd','Quantidade','n'],['min','Mínimo','n'],['preco','Preço (R$)','n']],
  sum:function(r){return[['Itens',r.length],['Abaixo do mínimo',r.filter(function(x){return +x.qtd<+x.min}).length],['Valor em estoque',R(r.reduce(function(a,x){return a+x.qtd*x.preco},0))]]},
  seed:[{produto:'Cabo de rede Cat6 (m)',qtd:120,min:50,preco:2.5},{produto:'Conector RJ45',qtd:30,min:100,preco:0.8},{produto:'SSD 240GB',qtd:6,min:3,preco:140}]},
 financas:{t:'Finanças',i:'💰',f:[['desc','Descrição'],['tipo','Tipo','s',['Receita','Despesa']],['valor','Valor (R$)','n'],['data','Data','d']],
  sum:function(r){var a=sm(r.filter(function(x){return x.tipo==='Receita'}),'valor'),b=sm(r.filter(function(x){return x.tipo==='Despesa'}),'valor');return[['Receitas',R(a)],['Despesas',R(b)],['Saldo',R(a-b)]]},
  seed:[{desc:'Serviço Escritório Silva',tipo:'Receita',valor:280,data:today},{desc:'Compra de SSD',tipo:'Despesa',valor:140,data:today}]}
};
function db(){return ld('ct_data_'+cur,{})}function rows(k){return db()[k]||[]}function put(k,a){var d=db();d[k]=a;sv('ct_data_'+cur,d)}
async function hs(t){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ct::'+t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(e){return btoa(unescape(encodeURIComponent('ct::'+t)))}}
var mode='in';document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){mode=b.dataset.m;document.querySelectorAll('.tabs button').forEach(function(o){o.classList.toggle('on',o===b)});$('go').textContent=mode==='in'?'Entrar':'Criar conta';$('er').textContent=''}});
async function auth(){var e=$('em').value.trim().toLowerCase(),p=$('pw').value,u=ld(U,{});
 if(!/^\S+@\S+\.\S+$/.test(e)){$('er').textContent='Digite um e-mail válido.';return}if(p.length<6){$('er').textContent='A senha precisa ter ao menos 6 caracteres.';return}
 var h=await hs(e+p);if(mode==='up'){if(u[e]){$('er').textContent='Este e-mail já tem conta.';return}u[e]=h;sv(U,u)}else if(u[e]!==h){$('er').textContent=u[e]?'Senha incorreta.':'Conta não encontrada. Use Criar conta.';return}
 sv(S,e);start(e)}
$('go').onclick=auth;$('pw').onkeydown=function(e){if(e.key==='Enter')auth()};
function start(e){cur=e;$('auth').hidden=true;$('app').hidden=false;$('who').textContent=e;draw()}
$('out').onclick=function(){localStorage.removeItem(S);location.reload()};
function draw(){$('nav').innerHTML=['painel'].concat(Object.keys(M)).map(function(k){return'<button data-t="'+k+'" class="'+(k===tab?'on':'')+'">'+(k==='painel'?'📊 Painel':M[k].i+' '+M[k].t)+'</button>'}).join('');
 $('nav').querySelectorAll('button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;editI=null;q='';draw()}});tab==='painel'?painel():mod(tab)}
function painel(){var h='<div class="g">';Object.keys(M).forEach(function(k){M[k].sum(rows(k)).forEach(function(s,j){h+='<div class="st"><small>'+M[k].i+' '+M[k].t+' · '+s[0]+'</small><b>'+esc(s[1])+'</b></div>'})});h+='</div>';
 var ch=rows('chamados'),tot=ch.length||1;h+='<div class="k" style="margin-top:14px"><h2>Chamados por status</h2>'+['Aberto','Em andamento','Concluído'].map(function(s){var n=ch.filter(function(x){return x.status===s}).length;return'<div class="bar"><span>'+s+'</span><div><i style="width:'+(100*n/tot)+'%"></i></div><b>'+n+'</b></div>'}).join('')+'</div>';
 var any=Object.keys(M).some(function(k){return rows(k).length});h+='<div class="k"><h2>Comece por aqui</h2><p style="color:var(--m);margin:0 0 10px">'+(any?'Seus dados ficam salvos neste navegador, separados por conta.':'Ainda não há dados. Carregue exemplos para testar ou cadastre pelos módulos acima.')+'</p><button class="p" id="seed">Carregar dados de exemplo</button> <button class="d" id="clr">Apagar todos os dados</button></div>';
 $('main').innerHTML=h;$('seed').onclick=function(){Object.keys(M).forEach(function(k){if(!rows(k).length)put(k,M[k].seed)});draw()};$('clr').onclick=function(){if(confirm('Apagar todos os dados desta conta?')){sv('ct_data_'+cur,{});draw()}}}
function mod(k){var m=M[k],all=rows(k),e=editI!=null?all[editI]:null,list=all.map(function(r,i){return{r:r,i:i}}).filter(function(x){return!q||JSON.stringify(x.r).toLowerCase().indexOf(q)>=0});
 var h='<div class="g" style="margin-bottom:14px">'+m.sum(all).map(function(s){return'<div class="st"><small>'+s[0]+'</small><b>'+esc(s[1])+'</b></div>'}).join('')+'</div>';
 h+='<div class="k"><h2>'+(e?'Editar registro':'Novo registro')+'</h2><div class="fm">'+m.f.map(function(f){var v=e?e[f[0]]:(f[2]==='d'?today:''),id='f_'+f[0];return'<div><label for="'+id+'">'+f[1]+'</label>'+(f[2]==='s'?'<select id="'+id+'">'+f[3].map(function(o){return'<option'+(o===v?' selected':'')+'>'+o+'</option>'}).join('')+'</select>':'<input id="'+id+'" type="'+(f[2]==='n'?'number" step="0.01':f[2]==='d'?'date':'text')+'" value="'+esc(v)+'">')+'</div>'}).join('')+'<div><button class="p" id="sv">'+(e?'Salvar edição':'Adicionar')+'</button>'+(e?' <button id="cn">Cancelar</button>':'')+'</div></div></div>';
 h+='<div class="k"><div class="row" style="margin:0 0 10px"><input id="q" placeholder="Buscar..." value="'+esc(q)+'"><button id="ex">Baixar CSV</button></div><div class="tw"><table><thead><tr>'+m.f.map(function(f){return'<th>'+f[1]+'</th>'}).join('')+'<th></th></tr></thead><tbody>'+(list.length?list.map(function(x){return'<tr>'+m.f.map(function(f){var v=x.r[f[0]],c='';if(f[0]==='status')c=v==='Concluído'||v==='Online'?'ok':v==='Offline'?'er':'wa';return'<td>'+(f[2]==='n'?esc(v):f[0]==='status'?'<span class="tag '+c+'">'+esc(v)+'</span>':esc(v))+'</td>'}).join('')+'<td><button data-e="'+x.i+'">Editar</button> <button class="d" data-d="'+x.i+'">Excluir</button></td></tr>'}).join(''):'<tr><td colspan="'+(m.f.length+1)+'" style="color:var(--m)">Nenhum registro.</td></tr>')+'</tbody></table></div></div>';
 $('main').innerHTML=h;
 $('sv').onclick=function(){var o={},ok=true;m.f.forEach(function(f){var v=$('f_'+f[0]).value;if(f[2]==='n')v=parseFloat(v)||0;else if(f[2]!=='s'&&!String(v).trim()&&f[0]===m.f[0][0])ok=false;o[f[0]]=v});if(!ok){alert('Preencha o primeiro campo.');return}var a=rows(k);if(editI!=null)a[editI]=o;else a.unshift(o);put(k,a);editI=null;draw()};
 if($('cn'))$('cn').onclick=function(){editI=null;draw()};
 $('q').oninput=function(){q=this.value.toLowerCase();var p=this.selectionStart;mod(k);var n=$('q');n.focus();n.setSelectionRange(p,p)};
 $('ex').onclick=function(){var s=m.f.map(function(f){return f[1]}).join(';')+'\n'+all.map(function(r){return m.f.map(function(f){return'"'+String(r[f[0]]).replace(/"/g,'""')+'"'}).join(';')}).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download=k+'.csv';a.click()};
 $('main').querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){editI=+b.dataset.e;mod(k);window.scrollTo(0,0)}});
 $('main').querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(confirm('Excluir este registro?')){var a=rows(k);a.splice(+b.dataset.d,1);put(k,a);editI=null;draw()}}})}
var s0=ld(S,null);if(s0&&ld(U,{})[s0])start(s0);
</script></body></html>
